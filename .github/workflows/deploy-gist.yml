name: Deploy to Gist

# Bundles the simulator into one self-contained index.html and pushes it to a GitHub Gist.
#
# One-time setup:
#   1. Create a secret gist (any placeholder file) at https://gist.github.com and copy its ID
#      from the URL: https://gist.github.com/<user>/<GIST_ID>
#   2. Create a personal access token with the "gist" scope
#      (fine-grained: Account permissions → Gists → Read and write).
#   3. In the repo: Settings → Secrets and variables → Actions → add
#        GIST_TOKEN = the token
#        GIST_ID    = the gist ID
#
# The live page is then viewable at https://gistpreview.github.io/?<GIST_ID>

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gist
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle into a single HTML file
        run: node scripts/bundle.mjs

      - name: Update gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "::error::Set the GIST_TOKEN and GIST_ID repository secrets (see the comment at the top of this workflow)."
            exit 1
          fi
          jq -n --rawfile html dist/index.html --rawfile readme README.md \
            '{description: "ECU Simulator — engine management, sensor by sensor",
              files: {"index.html": {content: $html}, "README.md": {content: $readme}}}' > payload.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            --data @payload.json)
          if [ "$status" != "200" ]; then
            echo "::error::Gist update failed (HTTP $status)"
            jq -r '.message // .' response.json
            exit 1
          fi
          echo "Deployed: https://gistpreview.github.io/?$GIST_ID" | tee -a "$GITHUB_STEP_SUMMARY"
